name: Dependency review

# Blocks a pull request that introduces a dependency with a known
# vulnerability. This is the control that matters most for drive-by
# contributions, because the most common way to get malicious code into a
# project is not a suspicious diff — it is an innocuous-looking new package.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # Licences that would create obligations this project cannot meet.
          deny-licenses: AGPL-3.0, GPL-3.0, LGPL-3.0
